// Highlight text helper
const HighlightText = ({ text, highlight }) => {
  if (!highlight || !highlight.trim()) return el("span", null, text);
  const terms = highlight.trim().split(/\s+/).filter(Boolean).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (terms.length === 0) return el("span", null, text);
  const regex = new RegExp(`(${terms.join('|')})`, 'gi');
  const parts = text.split(regex);
  return el("span", null, parts.map((part, i) => regex.test(part) ?
    el("mark", { key: i, className: "bg-amber-200/90 dark:bg-amber-400/30 text-slate-900 dark:text-amber-200 font-semibold px-0.5 rounded-xs" }, part)
    : part
  ));
};

    setTimeout(() => setCopied(false), 2000);

  return el("div", { className: "relative my-4 rounded-xl bg-slate-900 dark:bg-slate-950/90 border border-slate-800 dark:border-slate-800 text-slate-100 overflow-hidden font-mono text-sm shadow-md group" },

// Interactive Terminal Showcase
const TerminalShowcase = () => {
  const [activeTab, setActiveTab] = useState('start');
  const [step, setStep] = useState(4);
  const [isPlaying, setIsPlaying] = useState(false);
  const [copied, setCopied] = useState(false);

  const tabs = [
    { id: 'start', label: '⚡ contrib start', badge: '1.2s setup', cmd: 'contrib start https://github.com/facebook/react/issues/28000 --worktree --install' },
    { id: 'dashboard', label: '🖥️ contrib dashboard', badge: 'TUI Interface', cmd: 'contrib dashboard' },
    { id: 'sync', label: '🔄 contrib sync & submit', badge: 'Git Flow', cmd: 'contrib sync --push && contrib submit' },
    { id: 'search', label: '🔍 contrib search', badge: 'Discovery', cmd: 'contrib search "good first issue" --repo psf/requests --limit 3' }
  ];

  const currentTab = tabs.find(t => t.id === activeTab) || tabs[0];

  const handleReplay = () => {
    setStep(0);
    setIsPlaying(true);
    let s = 0;
    const interval = setInterval(() => {
      s++;
      setStep(s);
      if (s >= 4) {
        clearInterval(interval);
        setIsPlaying(false);
      }
    }, 450);
  };

  const handleCopy = () => {
    navigator.clipboard.writeText(currentTab.cmd);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  return el("div", { className: "my-6 rounded-2xl overflow-hidden border border-slate-800 dark:border-slate-800 bg-slate-950 shadow-2xl font-mono text-xs sm:text-sm text-slate-200" },
    // Mac-style Terminal Header
    el("div", { className: "px-4 py-3 bg-slate-900 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2 select-none" },

        el("span", { className: "w-3 h-3 rounded-full bg-rose-500 inline-block" }),
        el("span", { className: "w-3 h-3 rounded-full bg-amber-500 inline-block" }),
        el("span", { className: "w-3 h-3 rounded-full bg-emerald-500 inline-block" }),
        el("span", { className: "ml-2 text-xs text-slate-400 font-sans font-medium hidden sm:inline" }, "Terminal — contrib v0.4.0 — zsh")
      ),
      el("div", { className: "flex items-center gap-1.5" },
        el("button", {
          onClick: handleReplay,
          disabled: isPlaying,
          className: "flex items-center gap-1 px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors text-xs font-sans font-medium cursor-pointer disabled:opacity-50",

        }, el(RotateCcwIcon, { className: "w-3 h-3" }), el("span", null, isPlaying ? "Running..." : "Replay")),
        el("button", {
          onClick: handleCopy,
          className: "flex items-center gap-1 px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors text-xs font-sans font-medium cursor-pointer",
          title: "Copy terminal command"
        }, copied ? [
          el(CheckIcon, { key: "c1", className: "w-3 h-3 text-emerald-400" }),
          el("span", { key: "c2", className: "text-emerald-400" }, "Copied")
        ] : [
          el(CopyIcon, { key: "c3", className: "w-3 h-3" }),
          el("span", { key: "c4" }, "Copy")
        ])
      )
    ),
    // Tabs
    el("div", { className: "flex border-b border-slate-800/80 bg-slate-900/60 overflow-x-auto text-xs" },
      tabs.map(tab => el("button", {
        key: tab.id,
        onClick: () => { setActiveTab(tab.id); setStep(4); },
        className: `flex items-center gap-2 px-4 py-2.5 font-sans font-medium border-b-2 transition-all cursor-pointer whitespace-nowrap ${activeTab === tab.id ? 'border-blue-500 text-white bg-slate-900' : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900/40'}`

// Architecture Comparison & Interactive Calculator
const ArchitectureComparison = () => {
  const [selectedRepo, setSelectedRepo] = useState('react');
  const [workspaceCount, setWorkspaceCount] = useState(3);

  const repos = {
    react: { name: 'facebook/react', fullSize: 1200, bloblessSize: 18, fullTime: 145, bloblessTime: 1.2 },
    kubernetes: { name: 'kubernetes/kubernetes', fullSize: 3800, bloblessSize: 42, fullTime: 380, bloblessTime: 1.8 },
    linux: { name: 'torvalds/linux', fullSize: 8500, bloblessSize: 65, fullTime: 720, bloblessTime: 2.4 },
    requests: { name: 'psf/requests', fullSize: 180, bloblessSize: 8, fullTime: 35, bloblessTime: 0.8 }
  };

  const current = repos[selectedRepo];
  const traditionalTotalMB = current.fullSize * workspaceCount;
  const contribTotalMB = current.bloblessSize + (workspaceCount * 2); // Shared bare cache + tiny worktree metadata

      code: "export HTTP_PROXY=\"http://proxy.mycorp.com:8080\"\nexport HTTPS_PROXY=\"http://proxy.mycorp.com:8080\"\n\n# Configure git to use corporate CA certificate bundle\ngit config --global http.sslCAInfo /path/to/corporate-ca.crt\n\n# Or for Node.js corporate trust store\nexport NODE_EXTRA_CA_CERTS=\"/path/to/corporate-ca.crt\""
    },
    {

    },
    {
      q: "What happens if a network drop or interruption corrupts a worktree checkout?",
      cat: "Git & Worktrees",
      a: "Because contrib isolates workspaces as Git worktrees linked to a centralized bare repository (~/.contrib/cache), you never have to re-clone the entire repository if a connection drops. Simply repair or prune the worktree:",
      code: "# Run contrib built-in diagnostics and repair\ncontrib doctor --repair\n\n# Or manually prune broken git worktree references\ngit -C ~/.contrib/cache/<owner>__<repo>.git worktree prune -v\n\n# Resume or recreate workspace\ncontrib start <url> --worktree"
    },
    {
      q: "I see an error: 'fatal: --filter=blob:none requires git >= 2.25.0'. How do I upgrade?",
      cat: "Git & Worktrees",
      a: "Blobless clones (--filter=blob:none) and cone-mode sparse-checkouts were stabilized in Git 2.25.0. Make sure your system Git meets this baseline:",
      code: "# macOS (Homebrew)\nbrew install git\n\n# Ubuntu / Debian Linux\nsudo add-apt-repository ppa:git-core/ppa -y\nsudo apt update && sudo apt install -y git\n\n# Windows (winget or Git for Windows)\nwinget install --id Git.Git -e --source winget"

    }

// Search Modal (Cmd+K / Ctrl+K)
const SearchModal = ({ isOpen, onClose, onSelect, onOpenFindInPage }) => {
  const [query, setQuery] = useState('');
  const [selectedCategory, setSelectedCategory] = useState('All');
  const [selectedIndex, setSelectedIndex] = useState(0);
  const inputRef = useRef(null);
  const categories = ['All', 'Workspace', 'Git & PR', 'Discovery', 'Diagnostics', 'Guides', 'Architecture', 'Security'];

  useEffect(() => {
    if (isOpen) {
      setQuery('');
      setSelectedCategory('All');
      setSelectedIndex(0);
      setTimeout(() => inputRef.current?.focus(), 50);
    }
  }, [isOpen]);

  const results = useMemo(() => {
    let pool = SEARCH_INDEX;
    if (selectedCategory !== 'All') {
      pool = pool.filter(x => x.category.toLowerCase().includes(selectedCategory.toLowerCase()));
    }
    const q = query.trim().toLowerCase();
    if (!q) return pool.slice(0, 6);
    const terms = q.split(/\s+/).filter(Boolean);
    return pool.filter(item => {
      const haystack = `${item.title} ${item.category} ${item.keywords} ${item.description}`.toLowerCase();
      return terms.every(t => haystack.includes(t));
    }).slice(0, 8);
  }, [query, selectedCategory]);

  useEffect(() => {
    setSelectedIndex(0);
  }, [results]);

  const handleKeyDown = e => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setSelectedIndex(prev => (prev + 1) % Math.max(1, results.length));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setSelectedIndex(prev => (prev - 1 + results.length) % Math.max(1, results.length));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (results[selectedIndex]) onSelect(results[selectedIndex].id);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      onClose();
    }
  };

  if (!isOpen) return null;

  return el("div", {
    className: "fixed inset-0 z-50 bg-slate-900/40 dark:bg-black/70 backdrop-blur-md flex items-start justify-center pt-16 sm:pt-24 px-4",
    onClick: onClose

// Google Docs Style Find Bar (Ctrl+F)
const GoogleDocsFindBar = ({ isOpen, onClose }) => {
  const [findText, setFindText] = useState('');
  const [matchCount, setMatchCount] = useState(0);
  const [currentMatch, setCurrentMatch] = useState(0);
  const findInputRef = useRef(null);

  useEffect(() => {
    if (isOpen) {
      setTimeout(() => findInputRef.current?.focus(), 50);
    } else {
      clearHighlights();
    }
  }, [isOpen]);

  const clearHighlights = () => {
    const main = document.querySelector('main');
    if (!main) return;
    const marks = main.querySelectorAll('mark.gdoc-match');
    marks.forEach(mark => {
      const parent = mark.parentNode;
      if (parent) {
        parent.replaceChild(document.createTextNode(mark.textContent), mark);
        parent.normalize();
      }
    });
  };

  const performSearch = (text, targetIdx = 0) => {
    clearHighlights();
    const clean = text.trim();
    if (!clean || clean.length < 2) {
      setMatchCount(0);
      setCurrentMatch(0);
      return;
    }
    const main = document.querySelector('main');
    if (!main) return;
    const regex = new RegExp(`(${clean.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (!node.textContent.trim()) return NodeFilter.FILTER_REJECT;
        const tag = node.parentElement?.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA') return NodeFilter.FILTER_REJECT;
        return regex.test(node.textContent) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const textNodes = [];
    while (walker.nextNode()) textNodes.push(walker.currentNode);
    let count = 0;
    textNodes.forEach(node => {
      const parent = node.parentNode;
      if (!parent) return;
      const textVal = node.textContent;
      const parts = textVal.split(regex);
      const fragment = document.createDocumentFragment();
      parts.forEach(part => {
        if (part.toLowerCase() === clean.toLowerCase()) {
          const mark = document.createElement('mark');
          mark.className = `gdoc-match px-0.5 transition-all duration-150 ${count === targetIdx ? 'gdoc-match-active' : 'gdoc-match-normal'}`;
          mark.dataset.matchIndex = count;
          mark.textContent = part;
          fragment.appendChild(mark);
          count++;
        } else if (part) {
          fragment.appendChild(document.createTextNode(part));
        }
      });
      parent.replaceChild(fragment, node);
    });
    setMatchCount(count);
    if (count > 0) {
      const boundedIndex = Math.min(targetIdx, count - 1);
      setCurrentMatch(boundedIndex);
      const activeEl = main.querySelector(`mark.gdoc-match[data-match-index="${boundedIndex}"]`);
      if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else {
      setCurrentMatch(0);
    }
  };

  const handleTextChange = e => {
    const val = e.target.value;
    setFindText(val);
    performSearch(val, 0);
  };

  const goToNext = () => {
    if (matchCount === 0) return;
    updateActiveMatch((currentMatch + 1) % matchCount);
  };

  const goToPrev = () => {
    if (matchCount === 0) return;
    updateActiveMatch((currentMatch - 1 + matchCount) % matchCount);
  };

  const updateActiveMatch = newIndex => {
    setCurrentMatch(newIndex);
    const main = document.querySelector('main');
    if (!main) return;
    const marks = main.querySelectorAll('mark.gdoc-match');
    marks.forEach((mark, idx) => {
      if (idx === newIndex) {
        mark.className = 'gdoc-match px-0.5 transition-all duration-150 gdoc-match-active';
        mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        mark.className = 'gdoc-match px-0.5 transition-all duration-150 gdoc-match-normal';
      }
    });
  };

  const handleKeyDown = e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      e.shiftKey ? goToPrev() : goToNext();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      onClose();
    }
  };

  if (!isOpen) return null;

  return el("div", { className: "fixed top-20 right-4 sm:right-8 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-slate-300 dark:border-slate-700 shadow-2xl rounded-xl p-2 flex items-center gap-2 text-xs" },
    el("div", { className: "flex items-center gap-1.5 pl-2 pr-2 py-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus-within:ring-2 focus-within:ring-blue-500" },
      el(SearchIcon, { className: "w-3.5 h-3.5 text-slate-400" }),
      el("input", {
        ref: findInputRef,
        type: "text",
        value: findText,
        onChange: handleTextChange,
        onKeyDown: handleKeyDown,
        placeholder: "Find in document...",
        className: "w-32 sm:w-48 bg-transparent text-xs text-slate-900 dark:text-slate-100 focus:outline-none placeholder-slate-400 dark:placeholder-slate-500"
      }),
      findText && el("button", {
        onClick: () => { setFindText(''); clearHighlights(); setMatchCount(0); setCurrentMatch(0); },
        className: "text-slate-400 hover:text-slate-600 p-0.5 cursor-pointer"
      }, el(CloseIcon, { className: "w-3 h-3" }))
    ),
    el("div", { className: "text-[11px] font-mono font-semibold px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded text-slate-700 dark:text-slate-300 min-w-[58px] text-center select-none" },
      findText.trim().length >= 2 ? (matchCount > 0 ? `${currentMatch + 1}/${matchCount}` : '0 of 0') : '0 found'
    ),
    el("div", { className: "flex items-center gap-0.5 border-l border-slate-200 dark:border-slate-700 pl-1" },
      el("button", { onClick: goToPrev, disabled: matchCount === 0, className: "p-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white rounded cursor-pointer disabled:opacity-30", title: "Previous match (Shift+Enter)" }, el(ChevronUpIcon, { className: "w-3.5 h-3.5" })),
      el("button", { onClick: goToNext, disabled: matchCount === 0, className: "p-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white rounded cursor-pointer disabled:opacity-30", title: "Next match (Enter)" }, el(ChevronDownIcon, { className: "w-3.5 h-3.5" }))
    ),
    el("button", { onClick: onClose, className: "p-1.5 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 rounded cursor-pointer", title: "Close find bar (Esc)" }, el(CloseIcon, { className: "w-3.5 h-3.5" }))
  );
};
